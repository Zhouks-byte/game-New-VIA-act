<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>零号行动 - 战场突击</title>
  <script>
    // Auto-redirect to the game page
    window.location.replace('fps_game.html');
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0e17;
      color: #fff;
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .loader {
      width: 60px;
      height: 60px;
      border: 3px solid rgba(255, 182, 39, 0.2);
      border-top-color: #ffb627;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #ffb627;
      margin-bottom: 8px;
      text-shadow: 0 0 30px rgba(255, 182, 39, 0.5);
    }
    .subtitle {
      font-size: 14px;
      color: #8b949e;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    .fallback {
      margin-top: 30px;
      font-size: 13px;
      color: #6e7681;
    }
    .fallback a {
      color: #ffb627;
      text-decoration: none;
      border-bottom: 1px dashed rgba(255, 182, 39, 0.4);
    }
  </style>
</head>
<body>
  <div class="loader"></div>
  <div class="title">零号行动</div>
  <div class="subtitle">战场突击 · 载入中</div>
  <div class="fallback">
    如果页面没有自动跳转，请 <a href="fps_game.html">点击这里开始游戏</a>
  </div>
</body>
</html>
